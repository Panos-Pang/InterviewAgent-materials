<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a0f;
      --bg-2: #0b1018;
      --panel: rgba(16, 22, 32, 0.72);
      --panel-strong: rgba(20, 28, 40, 0.88);
      --line: rgba(220, 232, 255, 0.12);
      --line-strong: rgba(220, 232, 255, 0.2);
      --text: #eef5ff;
      --muted: #9aa9bd;
      --soft: #c7d3e3;
      --blue: #7cb7ff;
      --cyan: #53d6be;
      --indigo: #aeb9ff;
      --amber: #f7bf64;
      --rose: #f09aae;
      --green: #98d87f;
      --radius: 8px;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.36);
      --ease: 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --cursor-x: 50vw;
      --cursor-y: 50vh;
      --cursor-opacity: 0;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(12, 17, 25, 0.98), rgba(5, 8, 13, 1) 62%),
        var(--bg);
      overflow-x: hidden;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.1) 76%, transparent);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.26;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(124, 183, 255, 0.14), transparent 24%),
        linear-gradient(115deg, transparent 0 23%, rgba(83, 214, 190, 0.08) 25%, transparent 28% 55%, rgba(247, 191, 100, 0.08) 58%, transparent 61%),
        repeating-linear-gradient(110deg, rgba(255,255,255,0.018) 0, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 8px);
    }

    button {
      color: inherit;
      font: inherit;
    }

    .spectral-lines {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
    }

    .cursor-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: var(--cursor-opacity);
      background:
        radial-gradient(
          circle 90px at var(--cursor-x) var(--cursor-y),
          rgba(124, 183, 255, 0.065) 0%,
          rgba(112, 205, 230, 0.052) 16%,
          rgba(83, 214, 190, 0.028) 38%,
          transparent 56%
        );
      mix-blend-mode: screen;
      transition: opacity 220ms ease;
    }

    .spectral-lines path {
      fill: none;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-dasharray: 12 18;
      animation: drift 16s linear infinite;
    }

    @keyframes drift {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -260; }
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(120px, 1fr);
      gap: 20px;
      align-items: center;
      padding: 18px clamp(20px, 4vw, 48px);
      background: linear-gradient(180deg, rgba(7, 10, 15, 0.92), rgba(7, 10, 15, 0.66));
      border-bottom: 1px solid rgba(220, 232, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: var(--blue);
      box-shadow: 0 0 18px rgba(124, 183, 255, 0.85);
      flex: 0 0 auto;
    }

    .brand-title {
      margin: 0;
      font-size: 14px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .version-pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .top-nav {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(104px, 1fr));
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .nav-btn {
      position: relative;
      min-height: 36px;
      min-width: 104px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: color var(--ease), background var(--ease), box-shadow var(--ease);
    }

    .nav-btn::after {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 4px;
      height: 2px;
      border-radius: 99px;
      opacity: 0;
      transform: scaleX(0.25);
      background: linear-gradient(90deg, var(--blue), var(--cyan), var(--amber));
      transition: opacity var(--ease), transform var(--ease);
    }

    .nav-btn:hover { color: var(--soft); }
    .nav-btn.active {
      color: #ffffff;
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 1px rgba(220,232,255,0.12), 0 12px 26px rgba(0,0,0,0.18);
    }
    .nav-btn.active::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
    }

    .lang-btn {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      color: var(--soft);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: border-color var(--ease), background var(--ease), color var(--ease);
    }

    .lang-btn:hover {
      border-color: var(--line-strong);
      background: rgba(255,255,255,0.075);
      color: #fff;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .page-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 26px 0 30px;
      border-bottom: 1px solid rgba(220,232,255,0.08);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      color: #fff;
      font-size: clamp(30px, 4vw, 38px);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0;
    }

    .page-subtitle {
      max-width: 740px;
      margin: 14px 0 0;
      color: var(--soft);
      font-size: 16px;
      line-height: 1.72;
    }

    .signal-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(116px, 1fr));
      gap: 8px;
      min-width: 360px;
    }

    .signal {
      min-height: 74px;
      padding: 12px;
      border: 1px solid rgba(220,232,255,0.1);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.035);
    }

    .signal strong {
      display: block;
      color: #fff;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
    }

    .signal span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
    }

    .content-stage {
      padding-top: 30px;
    }

    .hero-layout {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 0.72fr);
      gap: clamp(26px, 5vw, 58px);
      align-items: center;
      min-height: min(670px, calc(100vh - 96px));
      padding: clamp(36px, 7vh, 78px) 0 clamp(30px, 6vh, 64px);
    }

    .hero-copy {
      min-width: 0;
    }

    .hero-layout .eyebrow,
    .hero-layout .page-title,
    .hero-layout .page-subtitle,
    .hero-layout .signal {
      will-change: transform, opacity;
    }

    .hero-layout .page-title {
      max-width: 820px;
      font-size: clamp(40px, 6.2vw, 76px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .hero-layout .page-subtitle {
      max-width: 720px;
      font-size: clamp(16px, 1.4vw, 18px);
      line-height: 1.76;
    }

    .hero-layout .signal-strip {
      margin-top: 28px;
      width: min(100%, 620px);
      min-width: 0;
    }

    .hero-layout .signal {
      min-height: 88px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.065), rgba(255,255,255,0.025)),
        rgba(7, 11, 17, 0.66);
    }

    .hero-demo {
      position: relative;
      isolation: isolate;
      border: 1px solid rgba(220,232,255,0.14);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(124,183,255,0.095), rgba(255,255,255,0.025)),
        rgba(8, 13, 20, 0.78);
      box-shadow: var(--shadow);
      overflow: hidden;
      will-change: transform, opacity;
    }

    .hero-demo::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(124,183,255,0.18), transparent 34%, rgba(83,214,190,0.12)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 18px);
      opacity: 0.34;
    }

    .hero-demo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(220,232,255,0.1);
    }

    .hero-demo-head span {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .hero-demo-head small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .hero-demo video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #05080d;
    }

    .app-shell.page-switch-next {
      animation: pageSlideNext 360ms cubic-bezier(0.22, 0.72, 0.22, 1) both;
    }

    .app-shell.page-switch-prev {
      animation: pageSlidePrev 360ms cubic-bezier(0.22, 0.72, 0.22, 1) both;
    }

    @keyframes pageSlideNext {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pageSlidePrev {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .module-stack,
    .timeline-stack {
      display: grid;
      gap: 12px;
    }

    .timeline-stack {
      position: relative;
      gap: 18px;
      padding-left: 42px;
    }

    .timeline-stack::before {
      content: "";
      position: absolute;
      left: 16px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: linear-gradient(180deg, rgba(124,183,255,0.12), rgba(83,214,190,0.24), rgba(247,191,100,0.12));
      transform-origin: top;
    }

    .module-item {
      position: relative;
      isolation: isolate;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(18, 25, 36, 0.78), rgba(12, 17, 25, 0.72));
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
      overflow: hidden;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }

    .timeline-item {
      overflow: visible;
    }

    .timeline-item::after {
      content: attr(data-step);
      position: absolute;
      left: -42px;
      top: 30px;
      z-index: 2;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124,183,255,0.3);
      border-radius: 50%;
      background: #08101a;
      color: var(--blue);
      box-shadow: 0 0 18px rgba(124,183,255,0.22);
      font-size: 12px;
      font-weight: 800;
    }

    .module-item::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      opacity: 0;
      background:
        radial-gradient(circle at 18% 0%, rgba(112,132,154,0.055), transparent 30%),
        linear-gradient(135deg, rgba(112,132,154,0.035), transparent 42%);
      transition: opacity 420ms ease;
    }

    .module-item:hover {
      border-color: rgba(124,150,180,0.18);
      box-shadow: 0 18px 52px rgba(0,0,0,0.26);
    }

    .module-item.expanded {
      border-color: var(--accent-border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.038), rgba(255,255,255,0.018)),
        linear-gradient(135deg, var(--accent-soft), transparent 38%);
      box-shadow: var(--shadow);
    }

    .module-item.expanded::before {
      opacity: 0.62;
    }

    .module-header {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 112px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 20px 22px;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .module-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      background: var(--accent-soft);
      font-size: 17px;
    }

    .module-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 7px;
    }

    .module-title {
      color: #fff;
      font-size: 22px;
      line-height: 1.22;
      font-weight: 800;
    }

    .module-code {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border: 1px solid var(--accent-border);
      border-radius: 99px;
      color: #b7c7d9;
      background: rgba(112,132,154,0.04);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .module-subtitle {
      margin: 0;
      color: var(--soft);
      font-size: 15px;
      line-height: 1.55;
    }

    .chevron {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      transition: transform var(--ease), color var(--ease), border-color var(--ease);
    }

    .module-item.expanded .chevron {
      transform: rotate(180deg);
      color: #fff;
      border-color: var(--accent-border);
    }

    .module-body-shell {
      position: relative;
      z-index: 1;
      height: 0;
      overflow: hidden;
      transition: height 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .module-item.expanded .module-body-shell { height: auto; }
    .module-body {
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 260ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .module-item.expanded .module-body {
      opacity: 1;
      transform: translateY(0);
    }

    .module-detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      padding: 0 22px 22px 74px;
    }

    .detail-column {
      display: grid;
      gap: 22px;
    }

    .detail-group {
      padding-left: 16px;
      border-left: 2px solid var(--accent-border);
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px;
      color: #fff;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 800;
    }

    .detail-dot {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      flex: 0 0 auto;
    }

    .detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .detail-list li {
      position: relative;
      padding-left: 15px;
      color: var(--soft);
      font-size: 14.5px;
      line-height: 1.62;
    }

    .detail-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.75em;
      width: 4px;
      height: 4px;
      border-radius: 99px;
      background: var(--accent);
      opacity: 0.85;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 22px 24px 74px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(220,232,255,0.11);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: var(--soft);
      font-size: 12px;
      font-weight: 700;
    }

    .tech-grid {
      display: grid;
      gap: 18px;
    }

    .system-track {
      display: grid;
      grid-template-columns: repeat(7, minmax(90px, 1fr));
      gap: 0;
      padding: 18px;
      border: 1px solid rgba(220,232,255,0.11);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025)),
        rgba(8, 13, 20, 0.74);
      box-shadow: 0 14px 44px rgba(0,0,0,0.18);
      overflow-x: auto;
    }

    .track-step {
      position: relative;
      min-width: 90px;
      display: grid;
      justify-items: center;
      gap: 8px;
      color: var(--muted);
      text-align: center;
    }

    .track-step::before {
      content: "";
      position: absolute;
      left: 0;
      right: 50%;
      top: 15px;
      height: 1px;
      background: rgba(124,183,255,0.24);
      transform: scaleX(1);
      transform-origin: left;
    }

    .track-step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 50%;
      right: 0;
      top: 15px;
      height: 1px;
      background: rgba(124,183,255,0.24);
      transform: scaleX(1);
      transform-origin: left;
    }

    .track-step:first-child::before {
      display: none;
    }

    .track-step-dot {
      position: relative;
      z-index: 1;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124,183,255,0.28);
      border-radius: 50%;
      background: #08101a;
      color: var(--blue);
      box-shadow: 0 0 16px rgba(124,183,255,0.16);
      font-size: 10px;
      font-weight: 800;
    }

    .track-step b {
      color: #fff;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 800;
    }

    .track-step span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
    }

    .flow-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(16, 23, 33, 0.8), rgba(10, 15, 22, 0.76));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .flow-heading {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      padding: 20px 22px 12px;
      border-bottom: 1px solid rgba(220,232,255,0.08);
    }

    .flow-heading h3 {
      margin: 0;
      color: #fff;
      font-size: 22px;
      line-height: 1.22;
      font-weight: 800;
    }

    .flow-heading p {
      max-width: 560px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.62;
    }

    .flow-svg-wrap {
      overflow-x: auto;
      padding: 18px 12px;
      border-top: 1px solid rgba(220,232,255,0.08);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        #0e141c;
      background-size: 34px 34px;
    }

    .flow-svg {
      display: block;
      width: min(100%, 760px);
      min-width: 640px;
      height: auto;
      margin: 0 auto;
      overflow: visible;
    }

    .flow-svg text {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
      letter-spacing: 0;
    }

    .flow-svg .section-rect,

      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;

      line-height: 1.55;
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .demo-gallery {
      align-items: start;
    }

      min-height: 182px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      line-height: 1.25;
      font-weight: 800;

      line-height: 1.65;
    }

      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .manual-flow-list {
      margin: 16px 0 0;
      display: grid;
      gap: 10px;
    }

    .manual-flow-row {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid rgba(220,232,255,0.08);
    }

    .manual-flow-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .manual-flow-row b {
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 800;
    }

    .manual-flow-row span {
      color: var(--soft);
      font-size: 14px;
      line-height: 1.58;
    }

    .manual-list li {
      position: relative;
      padding-left: 15px;
      color: var(--soft);
      font-size: 14.5px;
      line-height: 1.55;
    }

    .manual-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.75em;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .manual-media-toggle {
      margin-top: 16px;
      border: 1px solid rgba(124,183,255,0.22);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(124,183,255,0.08), rgba(124,183,255,0.025)),
        rgba(5, 9, 14, 0.48);
      overflow: hidden;

    .manual-media-toggle summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      background: transparent;
      color: #f4f8ff;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }

    .manual-media-toggle summary::-webkit-details-marker {
      display: none;
    }

    .manual-media-button::after,
    .manual-media-toggle summary::after {
      content: "+";
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border: 1px solid rgba(124,183,255,0.35);
      border-radius: 50%;
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      transition: transform var(--ease), background var(--ease);
    }

    .manual-media-toggle.open .manual-media-button::after,
    .manual-media-toggle[open] summary::after {
      content: "-";
      transform: rotate(180deg);
      background: rgba(124,183,255,0.12);
    }

    .manual-media-panel {
      margin: 0;
      padding: 0 14px 14px;
      overflow: hidden;
    }

    .manual-media-toggle:not(.open) .manual-media-panel {

      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

      background: rgba(0,0,0,0.22);
    }

      z-index: 50;
      max-width: 260px;
      padding: 9px 12px;
      border: 1px solid rgba(220,232,255,0.15);
      border-radius: var(--radius);
      background: rgba(7, 10, 15, 0.92);
      color: #fff;
      box-shadow: 0 16px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px) scale(0.98);
      transition: opacity var(--ease), transform var(--ease);
    }

    .cursor-tip.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tip-main {
      display: block;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 800;
    }

    .tip-sub {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 960px) {
      .app-header {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .top-nav {
        width: 100%;

      }

      .nav-btn {
        min-width: 0;

      }

      .header-actions {

      }

      .page-intro {
        grid-template-columns: 1fr;
      }

      .hero-layout {
        min-height: 0;
        grid-template-columns: 1fr;
      }

      .signal-strip {
        min-width: 0;
        width: 100%;
      }

      .module-detail,
      .manual-grid,
      .demo-gallery {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {

        font-size: 12px;
      }

      }

      .top-nav {
        grid-template-columns: 1fr;
        border-radius: 14px;
      }

      .nav-btn {
        border-radius: 10px;
      }

      .header-actions {
        position: static;
        justify-content: flex-start;
      }

      .page-title {
        font-size: 30px;
      }

      .signal-strip,
      .logic-row {
        grid-template-columns: 1fr;
      }

      .hero-layout .page-title {
        font-size: 38px;
      }

      .timeline-stack {
        padding-left: 30px;
      }

      .timeline-item::after {
        left: -32px;
        width: 26px;
        height: 26px;
        font-size: 10px;
      }

      .system-track {
        grid-template-columns: repeat(7, minmax(86px, 1fr));
        padding: 14px;
      }

      .manual-flow-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .module-header {
        grid-template-columns: auto minmax(0, 1fr);
        min-height: 0;
      }

      .chevron {
        grid-column: 1 / -1;
        justify-self: start;
      }

      .module-detail,
      .tag-row {
        padding-left: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-glow {
        display: none;
      }

      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

        }, [

        ]);

    function drawText(svg, spec) {
      const text = svgEl("text", {
        x: spec.x,
        y: spec.y,
        "text-anchor": spec.anchor || "middle",
        "dominant-baseline": spec.baseline || "central",
        fill: spec.fill || neutral.label,
        "font-size": spec.size || 14,
        "font-weight": spec.weight || 500,
        opacity: spec.opacity ?? 1,
        className: spec.className || ""
      });
      text.textContent = tr(spec.text);
      svg.appendChild(text);
      return text;
    }

    function yOffset(diagram, value) {
      return (diagram.spacers || []).reduce((total, spacer) => (
        value >= spacer.from ? total + spacer.amount : total
      ), 0);
    }

    function sy(diagram, value) {
      return value + yOffset(diagram, value);
    }

    function shiftPathY(diagram, d) {
      const tokens = d.match(/[A-Za-z]|-?\d+(?:\.\d+)?/g) || [];
      let command = "";
      let coordIndex = 0;
      return tokens.map((token) => {
        if (/^[A-Za-z]$/.test(token)) {
          command = token;
          coordIndex = 0;
          return token;
        }
        const value = Number(token);
        const isVerticalOnly = command.toUpperCase() === "V";
        const isHorizontalOnly = command.toUpperCase() === "H";
        const isYCoordinate = isVerticalOnly || (!isHorizontalOnly && coordIndex % 2 === 1);
        coordIndex += 1;
        const shifted = isYCoordinate ? sy(diagram, value) : value;
        return Number.isInteger(shifted) ? String(shifted) : String(Number(shifted.toFixed(2)));
      }).join(" ");
    }

    function fitSvgText(textEl, maxWidth, initialSize, minSize = 8.5) {
      try {
        const currentWidth = textEl.getComputedTextLength();
        if (!currentWidth || currentWidth <= maxWidth) return;

        const nextSize = Math.max(minSize, Math.floor((initialSize * maxWidth / currentWidth) * 10) / 10);
        textEl.setAttribute("font-size", nextSize);

        if (nextSize === minSize && textEl.getComputedTextLength() > maxWidth) {
          textEl.setAttribute("textLength", maxWidth);
          textEl.setAttribute("lengthAdjust", "spacingAndGlyphs");
        }
      } catch {
        textEl.setAttribute("font-size", Math.max(minSize, initialSize - 1));
      }
    }

    function drawSection(svg, spec, diagram) {
      const theme = PALETTE[spec.theme];
      const group = svgEl("g", { className: "section" });
      const radius = spec.rx || 14;
      const sectionOffset = yOffset(diagram, spec.spacerRef ?? spec.y);
      const y = spec.y + sectionOffset;
      const labelText = tr(spec.label);
      const naturalLabelWidth = Math.max(54, [...labelText].reduce((sum, char) => sum + (char.charCodeAt(0) > 255 ? 12 : 7), 18));
      const labelWidth = Math.min(naturalLabelWidth, currentLang === "en" ? 176 : 150);
      const labelY = currentLang === "en" && naturalLabelWidth > 96
        ? y - 1
        : spec.labelY + sectionOffset;

      group.appendChild(svgEl("rect", {
        x: spec.x,
        y,
        width: spec.w,
        height: spec.h,
        rx: radius,
        fill: theme.tint,
        "fill-opacity": spec.emphatic ? 0.065 : 0.045,
        stroke: theme.stroke,
        "stroke-opacity": spec.emphatic ? 0.58 : 0.3,
        "stroke-width": spec.emphatic ? 1 : 0.8,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        className: "section-rect"
      }));

      group.appendChild(svgEl("rect", {
        x: spec.labelX - 8,
        y: labelY - 11,
        width: labelWidth,
        height: 22,
        rx: 5,
        fill: "#0e141c",
        "fill-opacity": 0.88
      }));
      const labelEl = svgEl("text", {
        x: spec.labelX,
        y: labelY,
        "dominant-baseline": "central",
        fill: theme.sub,
        "font-size": 12,
        "font-weight": 600,
        className: "section-label"
      }, []);
      labelEl.textContent = labelText;
      group.appendChild(labelEl);
      fitSvgText(labelEl, labelWidth - 14, 12, 9);
      svg.appendChild(group);
    }

    function drawEdge(svg, prefix, spec, diagram) {
      const attrs = {
        fill: "none",
        stroke: spec.stroke || neutral.line,
        "stroke-width": spec.width || 1.7,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        opacity: spec.opacity ?? 1,
        className: "connector"
      };
      if (spec.arrow) attrs["marker-end"] = `url(#${prefix}-arrow)`;
      if (spec.dashed) attrs["stroke-dasharray"] = "6 5";

      if (spec.type === "path") {
        svg.appendChild(svgEl("path", { ...attrs, d: shiftPathY(diagram, spec.d) }));
      } else {
        svg.appendChild(svgEl("line", {
          ...attrs,
          x1: spec.x1,
          y1: sy(diagram, spec.y1),
          x2: spec.x2,
          y2: sy(diagram, spec.y2)
        }));
      }
    }

    function drawNode(svg, prefix, spec, diagram) {
      const theme = PALETTE[spec.theme];
      const group = svgEl("g", { className: `node node-${spec.theme}` });
      const cx = spec.x + spec.w / 2;
      const y = sy(diagram, spec.y);
      if (spec.shape === "diamond") {
        const cy = y + spec.h / 2;
        group.appendChild(svgEl("polygon", {
          points: `${cx},${y} ${spec.x + spec.w},${cy} ${cx},${y + spec.h} ${spec.x},${cy}`,
          fill: `url(#${prefix}-${spec.theme})`,
          stroke: theme.stroke,
          "stroke-width": 1,
          filter: `url(#${prefix}-soft-shadow)`,
          className: "node-diamond"
        }));
      } else {
        group.appendChild(svgEl("rect", {
          x: spec.x,
          y,
          width: spec.w,
          height: spec.h,
          rx: spec.rx || 8,
          fill: `url(#${prefix}-${spec.theme})`,
          stroke: theme.stroke,
          "stroke-width": 1,
          filter: `url(#${prefix}-soft-shadow)`,
          className: "node-rect"
        }));
      }

      svg.appendChild(group);
      spec.lines.forEach((lineSpec) => {
        const fill = lineSpec.type === "sub" ? theme.sub : theme.text;
        const size = lineSpec.size || (lineSpec.type === "sub" ? 12 : 14);
        const weight = lineSpec.weight || (lineSpec.type === "sub" ? 440 : 620);
        const textEl = svgEl("text", {
          x: lineSpec.x || cx,
          y: sy(diagram, lineSpec.y),
          "text-anchor": lineSpec.anchor || "middle",
          "dominant-baseline": "central",
          fill,
          "font-size": size,
          "font-weight": weight,
          className: "node-text"
        }, []);
        textEl.textContent = tr(lineSpec.text);
        group.appendChild(textEl);
        const maxTextWidth = lineSpec.maxWidth || (spec.shape === "diamond" ? spec.w * 0.7 : spec.w - 18);
        fitSvgText(textEl, maxTextWidth, size, lineSpec.minSize || 8.5);
      });
    }

        ...spec,
        y: sy(diagram, spec.y),
        fill: spec.fill || neutral.label,

    function estimateSvgTextWidth(text, fontSize = 11) {
      return [...text].reduce((sum, char) => sum + (char.charCodeAt(0) > 255 ? fontSize : fontSize * 0.55), 0);
    }

    function drawLegend(svg, prefix, legendSpec, diagram) {
      const swatch = legendSpec.swatchSize || 12;
      const textGap = legendSpec.textGap || 6;
      const itemGap = legendSpec.gap || 16;
      const fontSize = legendSpec.fontSize || 11;
      const items = legendSpec.items.map((item) => {
        const text = tr(item.label);
        return {
          ...item,
          text,
          width: swatch + textGap + estimateSvgTextWidth(text, fontSize)
        };
      });
      const totalWidth = items.reduce((sum, item, index) => sum + item.width + (index ? itemGap : 0), 0);
      const viewWidth = diagram.width || 680;
      const margin = legendSpec.margin || 24;
      const scale = Math.min(1, (viewWidth - margin * 2) / totalWidth);
      const startX = (viewWidth - totalWidth * scale) / 2;
      const group = svgEl("g", {
        className: "flow-legend",
        transform: `translate(${startX}, ${sy(diagram, legendSpec.y)}) scale(${scale})`
      });

      let cursorX = 0;
      items.forEach((item, index) => {
        if (index) cursorX += itemGap;
        const theme = PALETTE[item.theme];
        group.appendChild(svgEl("rect", {
          x: cursorX,
          y: 0,
          width: swatch,
          height: swatch,
          rx: 3,
          fill: `url(#${prefix}-${item.theme})`,
          stroke: theme.stroke,
          "stroke-width": 0.8,
          className: "legend-swatch"
        }));
        group.appendChild(svgEl("text", {
          x: cursorX + swatch + textGap,
          y: swatch - 1,
          fill: neutral.label,
          "font-size": fontSize,
          "font-weight": 500,
          className: "legend-text"
        }));
        group.lastChild.textContent = item.text;
        cursorX += item.width;
      });
      svg.appendChild(group);
    }

      svg.lastChild.textContent = tr(diagram.title);
      svg.appendChild(svgEl("desc", { id: `${diagram.prefix}-desc` }));
      svg.lastChild.textContent = tr(diagram.desc);

      addDefs(svg, diagram.prefix);
      diagram.sections.forEach((item) => drawSection(svg, item, diagram));
      diagram.edges.forEach((item) => drawEdge(svg, diagram.prefix, item, diagram));
      diagram.nodes.forEach((item) => drawNode(svg, diagram.prefix, item, diagram));
      diagram.labels.forEach((item) => drawLabel(svg, item, diagram));
      drawLegend(svg, diagram.prefix, diagram.legend, diagram);

      mount.replaceChildren(svg);
    }


    let motionObservers = [];

    function hasAnime() {
      return !prefersReducedMotion() && Boolean(window.anime && typeof window.anime.animate === "function");
    }

    function runAnime(targets, params) {
      if (!hasAnime()) return null;
      try {
        const animation = window.anime.animate(targets, params);
        if (animation && typeof animation.play === "function") animation.play();
        return animation;
      } catch (error) {
        return null;
      }
    }

    function revealTargets(targets) {
      const list = targets instanceof Element ? [targets] : [...targets].filter(Boolean);
      list.forEach((target) => {
        target.style.opacity = "";
        target.style.transform = "";
      });
    }

    function clearMotionObservers() {
      motionObservers.forEach((observer) => observer.disconnect());
      motionObservers = [];
    }

    function animateInView(selector, paramsFactory) {
      if (!hasAnime()) return;
      const targets = [...document.querySelectorAll(selector)];
      if (!targets.length) return;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting || entry.target.dataset.animated === "true") return;
          entry.target.dataset.animated = "true";
          const params = typeof paramsFactory === "function" ? paramsFactory(entry.target) : paramsFactory;
          entry.target.style.opacity = "0";
          entry.target.style.transform = "translateY(12px)";
          window.requestAnimationFrame(() => runAnime(entry.target, params));
          window.setTimeout(() => revealTargets(entry.target), (params.duration || 420) + 120);
        });
      }, { threshold: 0.18, rootMargin: "0px 0px -8% 0px" });
      targets.forEach((target) => observer.observe(target));
      motionObservers.push(observer);
    }

    function renderApp() {
      const data = copy();
      clearMotionObservers();
      document.title = data.documentTitle;
      document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";

    function bindHighlightAccordions() {

    function animateHighlightToggle(item, shouldOpen) {
      const shell = item.querySelector(".module-body-shell");
      const body = item.querySelector(".module-body");

            body.style.transform = "";

      const startHeight = shell.scrollHeight;
      shell.style.height = `${startHeight}px`;
      body.style.opacity = "1";
      body.style.transform = "translateY(0)";
      window.requestAnimationFrame(() => {
        runAnime(shell, { height: `0px`, duration: 380 });
        runAnime(body, { opacity: 0, translateY: -6, duration: 260 });
        window.setTimeout(() => {
          item.classList.remove("expanded");

    function renderManualMedia(block) {

    function animateHero() {
      if (!hasAnime() || activeSection !== "highlights") return;
      const sequence = [
        { selector: ".brand-mark", params: { scale: 1, opacity: 1, duration: 360 } },
        { selector: "[data-animate='hero-kicker']", params: { opacity: 1, translateY: 0, duration: 360 } },
        { selector: "[data-animate='hero-title']", params: { opacity: 1, translateY: 0, duration: 520 } },
        { selector: "[data-animate='hero-subtitle']", params: { opacity: 1, translateY: 0, duration: 460 } },
        { selector: ".hero-layout .signal", params: { opacity: 1, translateY: 0, duration: 420, delay: (_, index) => 360 + index * 80 } },
        { selector: ".hero-demo", params: { opacity: 1, translateY: 0, duration: 520 } }
      ];

      sequence.forEach((item, index) => {
        const targets = [...document.querySelectorAll(item.selector)];
        if (!targets.length) return;
        targets.forEach((target) => {
          target.style.opacity = item.selector === ".brand-mark" ? "0.45" : "0";
          target.style.transform = item.selector === ".brand-mark" ? "scale(0.72)" : "translateY(10px)";
        });
        const delay = item.params.delay ?? index * 90;
        window.requestAnimationFrame(() => runAnime(targets, { ...item.params, delay }));
        window.setTimeout(() => revealTargets(targets), 900);
      });
    }

    function runSectionAnimations() {
      if (!hasAnime()) return;
      animateHero();

      animateInView("[data-animate='timeline-item']", (target) => ({
        opacity: 1,
        translateY: 0,
        duration: 460,
        delay: Number(target.dataset.step || 1) * 60
      }));

      animateInView("[data-animate='system-track']", () => ({
        opacity: 1,
        translateY: 0,
        duration: 420
      }));

      const trackSteps = document.querySelectorAll(".track-step");
      if (trackSteps.length) {
        trackSteps.forEach((step) => {
          step.style.opacity = "0.35";
          step.style.transform = "translateY(8px)";
        });
        runAnime(trackSteps, {
          opacity: 1,
          translateY: 0,
          duration: 360,
          delay: (_, index) => index * 70
        });
        window.setTimeout(() => revealTargets(trackSteps), 900);
        const dots = document.querySelectorAll(".track-step-dot");
        dots.forEach((dot) => {
          dot.style.transform = "scale(0.86)";
        });
        runAnime(dots, {
          scale: 1,
          duration: 420,
          delay: (_, index) => 90 + index * 70
        });
        window.setTimeout(() => revealTargets(dots), 900);
      }

      animateInView("[data-animate='logic-node'], .flow-card, [data-animate='demo-card']", (target) => ({
        opacity: 1,
        translateY: 0,
        duration: 420,
        delay: Number(getComputedStyle(target).getPropertyValue("--card-index") || 0) * 45
      }));
    }

    function prefersReducedMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function scrollToSectionTop() {
      window.scrollTo({ top: 0, behavior: "auto" });
      window.requestAnimationFrame(() => {
        window.scrollTo({ top: 0, behavior: "auto" });
      });
    }

    function triggerPageTransition(direction) {
      if (prefersReducedMotion()) return;
      const shell = document.querySelector(".app-shell");
      if (!shell) return;
      if (hasAnime()) {
        runAnime(shell, {
          opacity: 1,
          translateY: 0,
          duration: 360
        });
        return;
      }
      shell.classList.remove("page-switch-next", "page-switch-prev");
      void shell.offsetWidth;
      shell.classList.add(direction === "prev" ? "page-switch-prev" : "page-switch-next");
      window.setTimeout(() => {
        shell.classList.remove("page-switch-next", "page-switch-prev");
      }, 420);
    }

    function goToSection(sectionKey, direction) {
      if (!sectionOrder.includes(sectionKey)) return;
      const previousIndex = sectionOrder.indexOf(activeSection);
      const nextIndex = sectionOrder.indexOf(sectionKey);
      const transitionDirection = direction || (nextIndex < previousIndex ? "prev" : "next");
      if (sectionKey === activeSection) {
        scrollToSectionTop();
        return;
      }

      scrollToSectionTop();
      activeSection = sectionKey;
      renderApp();
      pagingLockedUntil = performance.now() + pagingLockMs;
      resetPagingIntent();
      scrollToSectionTop();
      triggerPageTransition(transitionDirection);
    }

    function bindManualMediaToggles() {
      const playManualVideo = (video) => {
        const playRequest = video.play();
        if (playRequest && typeof playRequest.catch === "function") {
          playRequest.catch(() => {});
        }
      };

      document.querySelectorAll(".manual-media-toggle").forEach((toggle) => {
        const button = toggle.querySelector(".manual-media-button");
        const panel = toggle.querySelector(".manual-media-panel");
        const video = toggle.querySelector("video");
        if (!button || !panel) return;

        const setOpen = (shouldOpen) => {
          button.setAttribute("aria-expanded", shouldOpen ? "true" : "false");

          if (!hasAnime()) {
            toggle.classList.toggle("open", shouldOpen);
            if (shouldOpen) {
              if (video) playManualVideo(video);
            } else if (video) {
              video.pause();
              try { video.currentTime = 0; } catch (error) {}
            }
            return;
          }

          if (shouldOpen) {
            toggle.classList.add("open");
            panel.style.height = "0px";
            panel.style.opacity = "0";
            window.requestAnimationFrame(() => {
              const targetHeight = panel.scrollHeight;
              runAnime(panel, { height: `${targetHeight}px`, opacity: 1, duration: 360 });
              window.setTimeout(() => {
                panel.style.height = "auto";
                panel.style.opacity = "";
                if (video) playManualVideo(video);
              }, 390);
            });
            return;
          }

          const startHeight = panel.scrollHeight;
          panel.style.height = `${startHeight}px`;
          panel.style.opacity = "1";
          runAnime(panel, { height: `0px`, opacity: 0, duration: 280 });
          window.setTimeout(() => {
            toggle.classList.remove("open");
            panel.style.height = "";
            panel.style.opacity = "";
            if (video) {
              video.pause();
              try { video.currentTime = 0; } catch (error) {}
            }
          }, 310);
        };

        button.addEventListener("click", () => {
          setOpen(!toggle.classList.contains("open"));
        });

        if (toggle.classList.contains("open") && video) {
          playManualVideo(video);
        }
      });
    }

    function isInteractiveScrollTarget(target) {
      return Boolean(target.closest?.("video, audio, button, summary, a, input, textarea, select, [contenteditable='true']"));
    }

    function resetPagingIntent() {
      pagingIntent = { direction: "", distance: 0, startedAt: 0, lastAt: 0 };
    }

    function getPagingTarget(direction, currentIndex) {
      if (direction === "next" && currentIndex < sectionOrder.length - 1) {
        return sectionOrder[currentIndex + 1];
      }
      if (direction === "prev" && currentIndex > 0) {
        return sectionOrder[currentIndex - 1];
      }
      return "";
    }

    function recordPagingIntent(direction, deltaY) {
      const now = performance.now();
      if (
        pagingIntent.direction !== direction ||
        now - pagingIntent.lastAt > pagingStaleMs
      ) {
        pagingIntent = { direction, distance: 0, startedAt: now, lastAt: now };
      }

      pagingIntent.distance += Math.min(Math.abs(deltaY), pagingEventCap);
      pagingIntent.lastAt = now;

      const duration = now - pagingIntent.startedAt;
      return (
        pagingIntent.distance >= pagingDistanceThreshold ||
        (duration >= pagingDurationThreshold && pagingIntent.distance >= pagingDurationMinDistance)
      );
    }

    function handleSectionPaging(deltaY, eventTarget, event) {
      if (Math.abs(deltaY) < 8) return;
      if (performance.now() < pagingLockedUntil) return;
      if (eventTarget && isInteractiveScrollTarget(eventTarget)) return;

      const scrollRoot = document.scrollingElement || document.documentElement;
      const atTop = window.scrollY <= 8;
      const atBottom = window.scrollY + window.innerHeight >= scrollRoot.scrollHeight - 8;
      const currentIndex = sectionOrder.indexOf(activeSection);
      const direction = deltaY > 0 ? "next" : "prev";
      const atPagingBoundary = direction === "next" ? atBottom : atTop;
      const targetSection = getPagingTarget(direction, currentIndex);

      if (!atPagingBoundary || !targetSection) {
        resetPagingIntent();
        return;
      }

      if (recordPagingIntent(direction, deltaY)) {
        event?.preventDefault();
        goToSection(targetSection, direction);
      } else {
        event?.preventDefault();
      }
    }

    function bindSectionPaging() {
      window.addEventListener("wheel", (event) => {
        handleSectionPaging(event.deltaY, event.target, event);
      }, { passive: false });

      window.addEventListener("touchstart", (event) => {
        touchStartY = event.touches[0]?.clientY || 0;
        touchLatestY = touchStartY;
        touchPagingFromInteractive = isInteractiveScrollTarget(event.target);
      }, { passive: true });

      window.addEventListener("touchmove", (event) => {
        const nextY = event.touches[0]?.clientY || touchLatestY;
        const deltaY = touchLatestY - nextY;
        touchLatestY = nextY;
        if (touchPagingFromInteractive) return;
        handleSectionPaging(deltaY, null, event);
      }, { passive: false });

      window.addEventListener("touchend", (event) => {
        if (!touchPagingFromInteractive) resetPagingIntent();
      }, { passive: false });
    }

    const legacyLangButton = document.getElementById("global-lang-btn");
    if (legacyLangButton) {
      legacyLangButton.addEventListener("click", () => {
        currentLang = currentLang === "zh" ? "en" : "zh";
        renderApp();
      });
    }

    document.addEventListener("mousemove", (event) => {
      const tip = document.getElementById("cursor-tip");
      if (!tip) return;
      if (!tip.classList.contains("visible")) return;
      tip.style.left = `${event.clientX + 16}px`;
      tip.style.top = `${event.clientY + 16}px`;
    });

    const cursorGlow = document.getElementById("cursor-glow");
    const cursorState = { x: window.innerWidth / 2, y: window.innerHeight / 2, frame: 0 };

    function commitCursorGlow() {
      cursorState.frame = 0;
      document.documentElement.style.setProperty("--cursor-x", `${cursorState.x}px`);
      document.documentElement.style.setProperty("--cursor-y", `${cursorState.y}px`);
      document.documentElement.style.setProperty("--cursor-opacity", "1");
    }

    window.addEventListener("pointermove", (event) => {
      if (!cursorGlow) return;
      cursorState.x = event.clientX;
      cursorState.y = event.clientY;
      if (!cursorState.frame) {
        cursorState.frame = window.requestAnimationFrame(commitCursorGlow);
      }
    });

    window.addEventListener("pointerleave", () => {
      document.documentElement.style.setProperty("--cursor-opacity", "0");
    });

    window.addEventListener("blur", () => {
      document.documentElement.style.setProperty("--cursor-opacity", "0");
    });

    document.addEventListener("DOMContentLoaded", () => {
      // Disabled in the cinematic variant: the original three-section renderer
      // and wheel paging conflict with this page's continuous story scroll.
    });

          letter-spacing: 0;
          overflow-wrap: anywhere;
        }

        .cinema-split {
          display: grid;
          grid-template-columns: minmax(0, .95fr) minmax(360px, 1.05fr);
          gap: 54px;
          align-items: center;
        }

        .opening-scene {
          min-height: 94svh;
          align-items: end;
          padding-top: clamp(150px, 18svh, 220px);
          padding-bottom: clamp(82px, 10svh, 136px);
          text-align: center;
        }

        .opening-scene .scene-copy {
          margin: 0 auto;
        }

        .opening-scene .scene-title,
        .opening-scene .scene-subtitle {
          margin-left: auto;
          margin-right: auto;
        }

        .black-box-stage {
          position: relative;
          width: min(520px, 74vw);
          height: 318px;
          margin: 0 auto 42px;
          perspective: 900px;
        }

        .black-box {
          position: absolute;
          inset: 50% auto auto 50%;
          width: 230px;
          height: 230px;
          transform:
            translate(-50%, -50%)
            translateY(calc(var(--cinema-progress, 0) * -18px))
            rotateX(calc(58deg - var(--cinema-progress, 0) * 10deg))
            rotateZ(45deg)
            scale(calc(1 + var(--cinema-progress, 0) * .05));
          border: 1px solid rgba(174, 210, 246, .32);
          border-radius: 8px;
          background:
            linear-gradient(135deg, rgba(255,255,255,.08), transparent 28%),
            linear-gradient(315deg, rgba(124,183,255,.14), transparent 38%),
            #03070d;
          box-shadow:
            0 44px 110px rgba(0,0,0,.72),
            inset 0 0 42px rgba(124,183,255,.08),
            0 0 80px rgba(124,183,255,.16);
        }

        .black-box-layer {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 190px;
          height: 34px;
          display: grid;
          place-items: center;
          border: 1px solid rgba(124,183,255,.2);
          border-radius: 7px;
          color: rgba(236,246,255,.82);
          background: linear-gradient(90deg, rgba(124,183,255,.16), rgba(124,183,255,.035));
          box-shadow: 0 0 24px rgba(124,183,255,.1);
          font-size: 10px;
          font-weight: 760;
          letter-spacing: .14em;
          text-transform: uppercase;
          opacity: calc(max(0, (var(--cinema-progress, 0) - var(--layer-start, 0)) * 4));
          transform:
            translate(-50%, -50%)
            translateY(calc(var(--layer-y, 0px) * var(--cinema-progress, 0)))
            rotateX(calc(58deg - var(--cinema-progress, 0) * 16deg))
            rotateZ(45deg)
            scale(calc(.78 + var(--cinema-progress, 0) * .18));
          transform-origin: center;
          pointer-events: none;
        }

        .black-box-layer:nth-child(2) { --layer-y: -102px; --layer-start: .12; }
        .black-box-layer:nth-child(3) { --layer-y: -54px; --layer-start: .2; }
        .black-box-layer:nth-child(4) { --layer-y: 6px; --layer-start: .28; }
        .black-box-layer:nth-child(5) { --layer-y: 66px; --layer-start: .36; }

        .black-box::before,
        .black-box::after {
          content: "";
          position: absolute;
          inset: 16px;
          border: 1px solid rgba(124, 183, 255, .16);
          border-radius: 6px;
        }

        .black-box::after {
          inset: 0;
          border: 0;
          opacity: .85;
          background: linear-gradient(90deg, transparent, rgba(124,183,255,.56), transparent);
          transform: translateX(calc((var(--cinema-progress, 0) * 190px) - 95px));
          mix-blend-mode: screen;
        }

        .scan-line {
          position: absolute;
          left: 50%;
          bottom: 28px;
          width: min(420px, 68vw);
          height: 1px;
          transform: translateX(-50%);
          background: linear-gradient(90deg, transparent, rgba(124,183,255,.8), transparent);
          box-shadow: 0 0 20px rgba(124,183,255,.58);
        }

        #scene-blackbox {
          --beam-progress: 0;
        }

        .beam-stage {
          position: relative;
          height: 420px;
          border: 1px solid rgba(255,255,255,.1);
          border-radius: 8px;
          background:
            radial-gradient(circle at 38% 50%, rgba(124,183,255,.1), transparent 32%),
            radial-gradient(circle at 72% 52%, rgba(124,183,255,.05), transparent 28%),
            rgba(255,255,255,.025);
          overflow: hidden;
          isolation: isolate;
        }

        .agent-roundtable-canvas,
        .agent-roundtable-fallback {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        .agent-roundtable-canvas {
          z-index: 3;
          opacity: calc(.68 + var(--beam-progress, 0) * .32);
        }

        .agent-roundtable-canvas canvas {
          display: block;
          width: 100%;
          height: 100%;
        }

        .agent-roundtable-fallback {
          z-index: 2;
          opacity: calc(.44 + var(--beam-progress, 0) * .38);
          transition: opacity .24s var(--cinema-ease);
        }

        .three-agent-ready .agent-roundtable-fallback {
          opacity: .12;
        }

        .fallback-table {
          position: absolute;
          left: 9%;
          top: 50%;
          width: min(300px, 45%);
          aspect-ratio: 1;
          transform: translateY(-50%) scale(calc(.92 + var(--beam-progress, 0) * .08));
          border: 1px solid rgba(124,183,255,.16);
          border-radius: 50%;
          box-shadow:
            inset 0 0 0 42px rgba(124,183,255,.025),
            0 0 58px rgba(124,183,255,.08);
        }

        .fallback-table::before {
          content: "";
          position: absolute;
          inset: 25%;
          border: 1px solid rgba(124,183,255,.16);
          border-radius: 50%;
        }

        .fallback-center,
        .fallback-node,
        .fallback-report span {
          position: absolute;
          border-radius: 50%;
          background: rgba(124,183,255,.18);
          border: 1px solid rgba(124,183,255,.24);
          box-shadow: 0 0 26px rgba(124,183,255,.12);
        }

        .fallback-center {
          left: 50%;
          top: 50%;
          width: 24%;
          aspect-ratio: 1;
          transform: translate(-50%, -50%);
          border-radius: 12px;
          background:
            linear-gradient(135deg, rgba(245,248,251,.14), transparent),
            rgba(4,8,14,.9);
        }

        .fallback-node {
          width: 17%;
          aspect-ratio: 1;
          opacity: calc(.28 + var(--beam-progress, 0) * .72);
        }

        .fallback-node:nth-child(2) { left: 50%; top: 3%; transform: translateX(-50%); }
        .fallback-node:nth-child(3) { right: 3%; top: 50%; transform: translateY(-50%); }
        .fallback-node:nth-child(4) { left: 50%; bottom: 3%; transform: translateX(-50%); }
        .fallback-node:nth-child(5) { left: 3%; top: 50%; transform: translateY(-50%); }

        .fallback-route {
          position: absolute;
          left: min(360px, 52%);
          right: min(268px, 39%);
          top: 51%;
          height: 2px;
          background:
            linear-gradient(90deg, rgba(124,183,255,.18), rgba(124,183,255,.72)) left / calc(var(--beam-progress, 0) * 100%) 100% no-repeat,
            rgba(124,183,255,.08);
          box-shadow: 0 0 18px rgba(124,183,255,.14);
          overflow: hidden;
        }

        .blackbox-copy,
        .beam-stage {
          opacity: calc(.46 + var(--beam-progress, 0) * .54);
          transform: translateY(calc((1 - var(--beam-progress, 0)) * 10px));
        }

        .blackbox-copy .problem-list li {
          opacity: calc(.38 + var(--beam-progress, 0) * .62);
          transform: none;
        }

        .beam-stage::before {
          content: "";
          position: absolute;
          inset: 0;
          opacity: calc(.08 + var(--beam-progress, 0) * .16);
          background:
            linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
          background-size: 72px 72px;
        }

        .fallback-report {
          position: absolute;
          right: 7%;
          top: 50%;
          width: min(230px, 34%);
          transform: translateY(-50%);
          display: grid;
          gap: 14px;
        }

        .fallback-report span {
          position: relative;
          display: block;
          width: 100%;
          height: 34px;
          border-radius: 10px;
          opacity: calc(.18 + var(--beam-progress, 0) * .54);
          background:
            linear-gradient(90deg, rgba(124,183,255,.3), rgba(124,183,255,.08)) left / calc(var(--beam-progress, 0) * 100%) 100% no-repeat,
            rgba(4,8,14,.72);
        }

        .problem-list {
          display: grid;
          gap: 14px;
          margin-top: 34px;
          padding: 0;
          list-style: none;
        }

        .problem-list li {
          padding: 18px 0;
          border-top: 1px solid var(--cinema-line);
          color: rgba(245,248,251,.82);
          font-size: 17px;
          line-height: 1.6;
        }

        .system-layers {
          display: grid;
          gap: 10px;
          max-width: 680px;
          margin-left: auto;
        }

        .system-layer {
          display: grid;
          grid-template-columns: 80px 132px 1fr;
          gap: 18px;
          align-items: center;
          padding: 15px 16px;
          border: 1px solid rgba(124,183,255,.14);
          border-radius: 8px;
          color: inherit;

          background: linear-gradient(90deg, rgba(124,183,255,.09), rgba(255,255,255,.025));

        }

        .system-layer:hover {

        .system-layer strong {

        .system-layer span {
          color: rgba(245,248,251,.66);
          font-size: 14px;
          line-height: 1.5;
        }

        .runtime-track {
          position: relative;
          display: grid;
          grid-template-columns: repeat(7, minmax(94px, 1fr));
          gap: 10px;
          margin: 38px 0 28px;
          --track-reveal: 1;
          clip-path: inset(0 calc((1 - var(--track-reveal, 1)) * 100%) 0 0);
          will-change: clip-path;
        }

        .runtime-track::before {
          content: "";
          position: absolute;
          top: 25px;
          left: 34px;
          right: 34px;
          height: 1px;
          background: linear-gradient(90deg, rgba(124,183,255,.1), rgba(124,183,255,.7), rgba(124,183,255,.1));
          transform-origin: left center;
          transform: scaleX(var(--track-reveal, 1));
        }

        .runtime-node {
          position: relative;
          z-index: 1;
          min-height: 122px;
          padding: 14px;
          border: 1px solid rgba(255,255,255,.1);
          border-radius: 8px;
          background: rgba(5, 10, 17, .76);
          opacity: calc(.18 + var(--node-reveal, 1) * .82);
          transform: translateX(calc((1 - var(--node-reveal, 1)) * -18px));
          transition: opacity .12s linear, transform .12s linear;
        }

        .runtime-node::before {
          content: "";
          display: block;
          width: 20px;
          height: 20px;
          margin-bottom: 18px;
          border: 1px solid rgba(124,183,255,.56);
          border-radius: 50%;

          box-shadow: 0 0 18px rgba(124,183,255,.42);

        .runtime-node b {
          display: block;

          font-size: 15px;
        }

        .runtime-node span {
          color: rgba(245,248,251,.58);

          line-height: 1.45;
        }

        .runtime-notes {
          display: grid;
          grid-template-columns: repeat(4, 1fr);

          clip-path: inset(0 calc((1 - var(--notes-reveal, 1)) * 100%) 0 0);
          will-change: clip-path;
        }

        .runtime-note,
        .evidence-panel,
        .manual-slate {
          border: 1px solid rgba(255,255,255,.1);

          background: rgba(255,255,255,.035);

        }

        .runtime-note {
          padding: 20px;

        .runtime-note h3,

        .manual-slate p {

          color: rgba(245,248,251,.64);
          font-size: 14px;
          line-height: 1.62;
        }

        .film-stage {
          margin-top: 38px;
        }

        .demo-showcase {

          grid-template-columns: auto minmax(0, 1fr) auto;
          gap: 16px;
          align-items: center;
          max-width: 100%;

        .demo-main {

          min-height: 620px;
          border-radius: 8px;
        }

        .demo-arrow {
          position: relative;
          z-index: 3;
          display: grid;
          place-items: center;
          width: 44px;
          height: 72px;
          border: 1px solid rgba(124,183,255,.18);
          border-radius: 8px;
          color: rgba(245,248,251,.82);
          background: rgba(8,14,22,.78);
          cursor: pointer;
          transition: transform .22s var(--cinema-ease), background .22s var(--cinema-ease), border-color .22s var(--cinema-ease), opacity .22s var(--cinema-ease);
        }

        .film-card {
          position: absolute;

        .film-copy {

        .film-copy small {

        .film-copy h3 {

        .film-copy p {

        .closing-scene {

        }

        .closing-scene .scene-copy {
          margin: 0 auto;
        }

        .closing-scene .scene-title,
        .closing-scene .scene-subtitle {
          margin-left: auto;
          margin-right: auto;
        }

        .closing-mark {

          height: 72px;

            linear-gradient(180deg, rgba(176,218,255,.42), rgba(124,183,255,.2)),

        .cinematic-root .reveal {

        return String(value)
          .replace(/&/g, "&amp;")

          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      function loadCinematicThree() {
        if (prefersReducedMotion()) return Promise.resolve(null);
        if (!cinematicThreePromise) {
          cinematicThreePromise = import("https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js")
            .catch(() => null);
        }
        return cinematicThreePromise;
      }

      async function initAgentRoundtableScene() {
        if (prefersReducedMotion()) return;
        const host = document.querySelector(".agent-roundtable-canvas");
        const THREE = await loadCinematicThree();
        if (!host || !host.isConnected || !THREE) return;

        const stage = host.closest(".beam-stage");
        stage?.classList.add("three-agent-ready");

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(1.7, window.devicePixelRatio || 1));
        host.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
        camera.position.z = 5;

        const blue = 0x7cb7ff;
        const pale = 0xeaf5ff;
        const tableMaterial = new THREE.MeshBasicMaterial({ color: blue, transparent: true, opacity: .14, depthWrite: false });
        const tableMaterialSoft = new THREE.MeshBasicMaterial({ color: blue, transparent: true, opacity: .08, depthWrite: false });
        const centerMaterial = new THREE.MeshBasicMaterial({ color: pale, transparent: true, opacity: .42, depthWrite: false });
        const nodeMaterial = new THREE.MeshBasicMaterial({ color: blue, transparent: true, opacity: .38, depthWrite: false });
        const pulseMaterial = new THREE.MeshBasicMaterial({ color: pale, transparent: true, opacity: .86, depthWrite: false });
        const reportMaterial = new THREE.MeshBasicMaterial({ color: blue, transparent: true, opacity: .12, depthWrite: false });
        const reportFillMaterial = new THREE.MeshBasicMaterial({ color: blue, transparent: true, opacity: .42, depthWrite: false });
        const lineMaterials = [];

        const tableOuter = new THREE.Mesh(new THREE.RingGeometry(.94, .955, 112), tableMaterial);
        const tableInner = new THREE.Mesh(new THREE.RingGeometry(.55, .562, 112), tableMaterialSoft);
        const center = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), centerMaterial);
        center.rotation.z = Math.PI / 4;
        const agents = Array.from({ length: 4 }, () => new THREE.Mesh(new THREE.CircleGeometry(1, 48), nodeMaterial.clone()));
        const pulse = new THREE.Mesh(new THREE.CircleGeometry(1, 32), pulseMaterial);
        const reportBlocks = Array.from({ length: 3 }, () => new THREE.Mesh(new THREE.PlaneGeometry(1, 1), reportMaterial.clone()));
        const reportFills = Array.from({ length: 3 }, () => new THREE.Mesh(new THREE.PlaneGeometry(1, 1), reportFillMaterial.clone()));
        const lines = Array.from({ length: 5 }, () => {
          const material = new THREE.LineBasicMaterial({ color: blue, transparent: true, opacity: .14 });
          lineMaterials.push(material);
          const line = new THREE.Line(new THREE.BufferGeometry(), material);
          return line;
        });

        scene.add(tableOuter, tableInner, center, pulse, ...agents, ...reportBlocks, ...reportFills, ...lines);

        let raf = 0;
        let isActive = false;
        let progress = 0;
        let aspect = 1;
        let compact = false;
        let centerPos = new THREE.Vector3();
        let routeEnd = new THREE.Vector3();
        let tableRadius = .4;
        let reportWidth = .44;
        let reportHeight = .1;
        const agentPositions = agents.map(() => new THREE.Vector3());
        const reportPositions = reportBlocks.map(() => new THREE.Vector3());

        const clamp01 = (value) => Math.min(1, Math.max(0, value));
        const smooth = (value) => {
          const t = clamp01(value);
          return t * t * (3 - 2 * t);
        };
        const disposeGeometry = (object) => {
          object.geometry?.dispose?.();
        };
        const setLine = (line, start, end) => {
          disposeGeometry(line);
          line.geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
        };

        function resize() {
          const rect = host.getBoundingClientRect();
          const width = Math.max(1, rect.width);
          const height = Math.max(1, rect.height);
          aspect = width / height;
          compact = aspect < 1.05;
          renderer.setSize(width, height, false);
          camera.left = -aspect;
          camera.right = aspect;
          camera.top = 1;
          camera.bottom = -1;
          camera.updateProjectionMatrix();

          tableRadius = compact ? .34 : Math.min(.44, aspect * .25);
          centerPos.set(compact ? 0 : -aspect * .38, compact ? .34 : 0, 0);
          const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
          angles.forEach((angle, index) => {
            agentPositions[index].set(
              centerPos.x + Math.cos(angle) * tableRadius,
              centerPos.y + Math.sin(angle) * tableRadius,
              0
            );
          });

          reportWidth = compact ? Math.min(1.02, aspect * 1.55) : Math.min(.58, aspect * .36);
          reportHeight = compact ? .085 : .105;
          const reportX = compact ? 0 : aspect * .46;
          const reportYs = compact ? [-.42, -.58, -.74] : [.25, 0, -.25];
          reportPositions.forEach((position, index) => position.set(reportX, reportYs[index], 0));
          routeEnd.copy(compact ? new THREE.Vector3(0, -.32, 0) : new THREE.Vector3(reportX - reportWidth * .62, 0, 0));

          tableOuter.position.copy(centerPos);
          tableInner.position.copy(centerPos);
          tableOuter.scale.setScalar(tableRadius);
          tableInner.scale.setScalar(tableRadius);
          center.position.copy(centerPos);
          center.scale.setScalar(compact ? .13 : .15);
          agents.forEach((agent, index) => {
            agent.position.copy(agentPositions[index]);
          });
          reportBlocks.forEach((block, index) => {
            block.position.copy(reportPositions[index]);
            block.scale.set(reportWidth, reportHeight, 1);
          });
          reportFills.forEach((block, index) => {
            block.position.copy(reportPositions[index]);
            block.scale.set(reportWidth * .62, reportHeight * .42, 1);
          });
          agentPositions.forEach((position, index) => setLine(lines[index], centerPos, position));
          setLine(lines[4], centerPos, routeEnd);
          renderFrame(performance.now(), true);
        }

        function renderFrame(now, once = false) {
          const t = now / 1000;
          const p = clamp01(progress);
          tableMaterial.opacity = .06 + p * .12;
          tableMaterialSoft.opacity = .04 + p * .08;
          centerMaterial.opacity = .18 + p * .48;
          center.scale.setScalar((compact ? .13 : .15) * (.82 + p * .22));
          lines.forEach((line, index) => {
            line.material.opacity = index === 4 ? (.05 + smooth((p - .36) / .48) * .34) : (.04 + p * .18);
          });

          agents.forEach((agent, index) => {
            const fill = smooth((p - index * .08) / .62);
            const pulseScale = 1 + (isActive ? Math.sin(t * 2.4 + index * 1.2) * .035 : 0);
            agent.scale.setScalar((compact ? .072 : .082) * (.72 + fill * .46) * pulseScale);
            agent.material.opacity = .14 + fill * .68;
          });

          reportBlocks.forEach((block, index) => {
            const fill = smooth((p - .45 - index * .08) / .42);
            block.material.opacity = .08 + fill * .18;
            reportFills[index].material.opacity = .04 + fill * .46;
            reportFills[index].scale.x = reportWidth * (.14 + fill * .48);
            reportFills[index].position.x = reportPositions[index].x - reportWidth * .2 + reportFills[index].scale.x * .5;
          });

          const orbitAngle = t * 1.65 + p * Math.PI * 2;
          const routeFill = smooth((p - .42) / .48);
          if (routeFill < .65) {
            pulse.position.set(
              centerPos.x + Math.cos(orbitAngle) * tableRadius,
              centerPos.y + Math.sin(orbitAngle) * tableRadius,
              0
            );
          } else {
            const lerp = smooth((routeFill - .62) / .38);
            pulse.position.set(
              centerPos.x + (routeEnd.x - centerPos.x) * lerp,
              centerPos.y + (routeEnd.y - centerPos.y) * lerp,
              0
            );
          }
          pulse.scale.setScalar((compact ? .03 : .036) * (.72 + p * .28));
          pulse.material.opacity = p > .06 ? .78 : 0;

          renderer.render(scene, camera);
          if (isActive && !once) {
            raf = window.requestAnimationFrame((next) => renderFrame(next));
          } else {
            raf = 0;
          }
        }

        resize();
        window.addEventListener("resize", resize, { passive: true });

        agentRoundtableLayer = {
          setProgress(value) {
            progress = clamp01(value);
            if (!isActive) renderFrame(performance.now(), true);
          },
          setActive(value) {
            const nextActive = Boolean(value) && !prefersReducedMotion();
            if (nextActive === isActive) return;
            isActive = nextActive;
            if (raf) window.cancelAnimationFrame(raf);
            raf = 0;
            if (isActive) {
              raf = window.requestAnimationFrame((next) => renderFrame(next));
            } else {
              renderFrame(performance.now(), true);
            }
          },
          dispose() {
            if (raf) window.cancelAnimationFrame(raf);
            window.removeEventListener("resize", resize);
            [tableOuter, tableInner, center, pulse, ...agents, ...reportBlocks, ...reportFills, ...lines].forEach((object) => {
              object.geometry?.dispose?.();
              object.material?.dispose?.();
            });
            lineMaterials.forEach((material) => material.dispose());
            renderer.dispose();
            stage?.classList.remove("three-agent-ready");
            host.replaceChildren();
          }
        };

        agentRoundtableLayer.setActive(activeSceneId === "scene-blackbox");
      }
