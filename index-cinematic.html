              <div class="memory-line reveal">
                ${page.memory.steps.map((step, index) => `
                  <div class="memory-step" data-index="${String(index + 1).padStart(2, "0")}">${safe(step)}</div>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      }

      function renderBlueprint(page) {
        return `
          <section class="cinema-scene" id="scene-blueprint" data-scene="blueprint">
            <div class="scene-inner">
              <div class="scene-copy reveal">
                <p class="scene-eyebrow">${safe(page.blueprint.eyebrow)}</p>
                <h2 class="scene-title">${safe(page.blueprint.title)}</h2>
                <p class="scene-subtitle">${safe(page.blueprint.subtitle)}</p>
              </div>
              <div class="blueprint-layout">
                <div class="manual-slates">
                  ${page.blueprint.cards.map((card) => `
                    <article class="manual-slate reveal">
                      <h3>${safe(card.title)}</h3>
                      <p>${safe(card.text)}</p>
                    </article>
                  `).join("")}
                </div>
                <article class="blueprint-card reveal">
                  <header>
                    <h3>${safe(page.blueprint.cards[0].title)}</h3>
                    <p>${safe(page.blueprint.cards[0].text)}</p>
                  </header>
                  <div class="blueprint-svg" id="cinema-interview-flow"></div>
                </article>
                <article class="blueprint-card reveal">
                  <header>
                    <h3>${safe(page.blueprint.cards[1].title)}</h3>
                    <p>${safe(page.blueprint.cards[1].text)}</p>
                  </header>
                  <div class="blueprint-svg" id="cinema-consultation-flow"></div>
                </article>
              </div>
            </div>
          </section>
        `;
      }

      function renderVision(page) {
        return `
          <section class="cinema-scene closing-scene" id="scene-vision" data-scene="vision">
            <div class="scene-inner">
              <div class="closing-mark reveal" aria-hidden="true"></div>
              <div class="scene-copy reveal">
                <p class="scene-eyebrow">${safe(page.vision.eyebrow)}</p>
                <h2 class="scene-title">${safe(page.vision.title)}</h2>
                <p class="scene-subtitle">${safe(page.vision.subtitle)}</p>
                <div class="vision-actions">
                  <a class="cinema-primary-link" href="https://daimian.top/" target="_blank" rel="noopener noreferrer">${safe(page.vision.startCta)}</a>
                  <button class="cinema-ghost-button" type="button" data-cinema-nav="scene-opening">${safe(page.vision.cta)}</button>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderCinematicPage() {
        const page = data();
        disposeCinematicThree();
        activeSceneId = "";
        document.title = page.documentTitle;
        document.documentElement.lang = cinemaLang === "zh" ? "zh-CN" : "en";
        document.body.className = "cinematic-mode";
        document.body.innerHTML = `
          <div class="cinematic-root">
            ${renderHeader(page)}
            ${renderProgress(page)}
            ${renderOpening(page)}
            ${renderBlackBox(page)}
            ${renderSystem(page)}
            ${renderRuntime(page)}
            ${renderDemo(page)}
            ${renderEvidence(page)}
            ${renderMemory(page)}
            ${renderBlueprint(page)}
            ${renderVision(page)}
          </div>
        `;
        bindCinematicInteractions();
        renderCinematicBlueprints();
        observeCinematicSections();
        initAgentRoundtableScene();
        requestAnimationFrame(() => {
          updateDemoStrip(false);
          queueCinematicScrollUpdate();
        });
      }

      function renderCinematicBlueprints() {
        try {
          currentLang = cinemaLang;
          renderDiagram({ ...diagrams.interview, mount: "cinema-interview-flow" });
          renderDiagram({ ...diagrams.consultation, mount: "cinema-consultation-flow" });
        } catch (error) {
          document.getElementById("cinema-interview-flow").textContent = "Diagram unavailable";
          document.getElementById("cinema-consultation-flow").textContent = "Diagram unavailable";
        }
      }

      function bindCinematicInteractions() {
        document.querySelectorAll("[data-cinema-nav]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.preventDefault();
            scrollToCinematicSection(button.dataset.cinemaNav, button.dataset.cinemaJump === "instant");
          });
        });

        document.getElementById("cinema-lang").addEventListener("click", () => {
          cinemaLang = cinemaLang === "zh" ? "en" : "zh";
          activeDemoIndex = 0;
          renderCinematicPage();
        });

        document.querySelectorAll("[data-layer-index]").forEach((layer) => {
          layer.addEventListener("click", () => {
            scrollToCinematicSection(layer.dataset.jump);
          });
        });

        document.querySelectorAll("[data-demo-control]").forEach((button) => {
          button.addEventListener("click", () => {
            setActiveDemo(Number(button.dataset.demoControl));
          });
        });

        document.querySelectorAll("[data-demo-step]").forEach((button) => {
          button.addEventListener("click", () => {
            const next = Math.max(0, Math.min(data().demo.items.length - 1, activeDemoIndex + Number(button.dataset.demoStep)));
            setActiveDemo(next);
          });
        });

        window.removeEventListener("scroll", queueCinematicScrollUpdate);
        window.removeEventListener("resize", queueCinematicScrollUpdate);
        window.addEventListener("scroll", queueCinematicScrollUpdate, { passive: true });
        window.addEventListener("resize", queueCinematicScrollUpdate, { passive: true });
      }

      function scrollToCinematicSection(sectionId, instant = false) {
        const target = document.getElementById(sectionId);
        if (!target) return;
        target.scrollIntoView({ behavior: instant || prefersReducedMotion() ? "auto" : "smooth", block: "start" });
        queueCinematicScrollUpdate();
        window.setTimeout(queueCinematicScrollUpdate, instant || prefersReducedMotion() ? 0 : 380);
      }

      function queueCinematicScrollUpdate() {
        if (cinematicScrollFrame) return;
        cinematicScrollFrame = window.requestAnimationFrame(() => {
          cinematicScrollFrame = 0;
          updateScanProgress();
          updateSceneProgress();
          updateRevealVisibility();
        });
      }

      function setActiveDemo(index) {
        activeDemoIndex = index;
        updateDemoStrip(true);
      }

      function updateDemoStrip(animate) {
        const cards = [...document.querySelectorAll(".film-card")];
        const controls = [...document.querySelectorAll("[data-demo-control]")];
        const arrows = [...document.querySelectorAll("[data-demo-step]")];
        if (!cards.length) return;

        cards.forEach((card, index) => {
          const video = card.querySelector("video");
          const isActive = index === activeDemoIndex;
          card.classList.toggle("active", isActive);
          if (video) {
            if (isActive) {
              const play = video.play();
              if (play && typeof play.catch === "function") play.catch(() => {});
            } else {
              video.pause();
            }
          }
        });

        controls.forEach((control, index) => control.classList.toggle("active", index === activeDemoIndex));
        arrows.forEach((arrow) => {
          const step = Number(arrow.dataset.demoStep);
          arrow.disabled = (step < 0 && activeDemoIndex === 0) || (step > 0 && activeDemoIndex === cards.length - 1);
        });

        const activeControl = controls[activeDemoIndex];
        const rail = activeControl?.parentElement;
        if (activeControl && rail) {
          const nextLeft = activeControl.offsetLeft - (rail.clientWidth - activeControl.clientWidth) / 2;
          rail.scrollTo({
            left: Math.max(0, nextLeft),
            behavior: animate && !prefersReducedMotion() ? "smooth" : "auto"
          });
        }
      }

      function updateScanProgress() {
        const opening = document.getElementById("scene-opening");
        const clamp01 = (value) => Math.min(1, Math.max(0, value));
        const smooth = (value) => {
          const t = clamp01(value);
          return t * t * (3 - 2 * t);
        };
        const quickReveal = (value) => {
          const t = clamp01(value);
          return 1 - Math.pow(1 - t, 4);
        };
        const sectionReveal = (element, offset = 0.8, span = 0.55, minDistance = 220) => {
          if (!element) return 0;
          const rect = element.getBoundingClientRect();
          return smooth((window.innerHeight * offset - rect.top) / Math.max(minDistance, rect.height * span));
        };
        const setSequencedReveal = (items, progress, property, step = 0.1) => {
          items.forEach((item, index) => {
            const fill = smooth((progress - index * step) / Math.max(0.01, 1 - index * step));
            item.style.setProperty(property, fill.toFixed(4));
          });
        };

        if (opening) {
          const progressSpan = Math.max(202, window.innerHeight * 0.224);
          const ratio = prefersReducedMotion() ? 1 : quickReveal(window.scrollY / progressSpan);
          document.documentElement.style.setProperty("--cinema-progress", ratio.toFixed(4));
        }

        const blackbox = document.getElementById("scene-blackbox");
        if (blackbox) {
          const rect = blackbox.getBoundingClientRect();
          const raw = (window.innerHeight * 0.68 - rect.top) / Math.max(768, rect.height * 1.2);
          const beam = prefersReducedMotion() ? 1 : smooth(raw);
          blackbox.style.setProperty("--beam-progress", beam.toFixed(4));
          agentRoundtableLayer?.setProgress?.(beam);
        }

        const runtime = document.getElementById("scene-runtime");
        if (runtime) {
          const runtimeProgress = prefersReducedMotion() ? 1 : sectionReveal(runtime.querySelector(".runtime-track"), 0.82, 1.68, 528);
          runtime.querySelector(".runtime-track")?.style.setProperty("--track-reveal", runtimeProgress.toFixed(4));
          runtime.querySelector(".runtime-notes")?.style.setProperty("--notes-reveal", runtimeProgress.toFixed(4));
          setSequencedReveal([...runtime.querySelectorAll(".runtime-node")], runtimeProgress, "--node-reveal", 0.085);
          setSequencedReveal([...runtime.querySelectorAll(".runtime-note")], runtimeProgress, "--note-reveal", 0.12);
        }

        const memory = document.getElementById("scene-memory");
        if (memory) {
          const memoryProgress = prefersReducedMotion() ? 1 : sectionReveal(memory.querySelector(".memory-line"), 0.78, 1.28, 391);
          memory.querySelector(".memory-line")?.style.setProperty("--memory-reveal", memoryProgress.toFixed(4));
          setSequencedReveal([...memory.querySelectorAll(".memory-step")], memoryProgress, "--step-reveal", 0.16);
        }
      }

      function updateSceneProgress() {
        const scenes = [...document.querySelectorAll(".cinema-scene")];
        if (!scenes.length) return;

        const centerLine = window.innerHeight * 0.5;
        let active = scenes[0];
        for (const scene of scenes) {
          const rect = scene.getBoundingClientRect();
          if (rect.top <= centerLine && rect.bottom > centerLine) {
            active = scene;
            break;
          }
          if (rect.top < centerLine) active = scene;
        }

        const id = active.id;
        if (id !== activeSceneId) {
          activeSceneId = id;
          runSceneEnterMotion(active);
          agentRoundtableLayer?.setActive?.(id === "scene-blackbox");
        }
        document.querySelectorAll(".scene-progress [data-progress-target]").forEach((dot) => {
          dot.classList.toggle("active", dot.dataset.progressTarget === id);
        });
        document.querySelectorAll(".cinema-nav button").forEach((button) => {
          const target = button.dataset.cinemaNav;
          const isActive =
            (target === "scene-opening" && ["scene-opening", "scene-blackbox"].includes(id)) ||
            (target === "scene-system" && ["scene-system", "scene-runtime"].includes(id)) ||
            (target === "scene-demo" && id === "scene-demo") ||
            (target === "scene-evidence" && ["scene-evidence", "scene-memory"].includes(id)) ||
            (target === "scene-blueprint" && ["scene-blueprint", "scene-vision"].includes(id));
          button.classList.toggle("active", isActive);
        });

        if (id === "scene-demo") updateDemoStrip(false);
      }

      function observeCinematicSections() {
        observers.forEach((observer) => observer.disconnect());
        observers = [];

        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("in-view");
            revealObserver.unobserve(entry.target);
          });
        }, { threshold: .14, rootMargin: "0px 0px -8% 0px" });

        document.querySelectorAll(".reveal").forEach((item) => revealObserver.observe(item));
        observers.push(revealObserver);

        updateRevealVisibility();
        updateSceneProgress();
      }

      function updateRevealVisibility() {
        const targets = [...document.querySelectorAll(".reveal:not(.in-view)")];
        if (!targets.length) return;
        if (prefersReducedMotion()) {
          targets.forEach((target) => target.classList.add("in-view"));
          return;
        }
        const enterLine = window.innerHeight * 0.9;
        const leaveLine = window.innerHeight * 0.04;
        targets.forEach((target) => {
          const rect = target.getBoundingClientRect();
          if (rect.top <= enterLine && rect.bottom >= leaveLine) {
            target.classList.add("in-view");
          }
        });
      }

      function mountCinematic() {
        installCinematicStyles();
        renderCinematicPage();
      }

      installCinematicStyles();
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountCinematic, { once: true });
      } else {
        mountCinematic();
      }
    })();
  </script>
</body>
</html>
